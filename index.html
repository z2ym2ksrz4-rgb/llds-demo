<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>LL Dance Studio App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500;600&display=swap">
<style>
/* Layout: a phone frame on wide screens, full-bleed on phones. Black stage, gold spotlight, grey satin. */
:root{
  --bg:#0a0a0b; --bg2:#121214; --card:#18181b; --card2:#1f1f23; --line:#2a2a2f;
  --fg:#f2efe8; --fg2:#a7a39b; --fg3:#6f6c66;
  --gold:#c9a24a; --gold2:#e6c87a; --gold3:#8c6c25;
  --ok:#7fb686; --warn:#d9a441; --bad:#c86b6b;
  --display:"Cormorant Garamond",Georgia,serif; --body:"Outfit",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:#050506;color:var(--fg);font-family:var(--body);font-weight:300;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:.005em}
input,textarea,select{font:inherit;color:var(--fg);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
::placeholder{color:var(--fg3)}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:24px;background:radial-gradient(1200px 600px at 50% -10%,#1c1710 0%,#050506 60%)}
.phone{width:min(430px,100%);height:min(900px,100%);background:var(--bg);border-radius:40px;position:relative;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.7),0 0 0 1px #26242a,0 0 0 9px #0c0c0d,0 0 0 10px #2a2a2f;display:flex;flex-direction:column}
@media (max-width:520px){.stage{padding:0;align-items:stretch;height:100%;min-height:0}.phone{width:100%;height:100%;border-radius:0;box-shadow:none}}
.screen{flex:1;overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.content{padding:18px 20px 110px;display:flex;flex-direction:column;gap:18px}
/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:16px 20px 6px;position:sticky;top:0;background:linear-gradient(var(--bg) 70%,transparent);z-index:5}
.top h1{font-size:28px;flex:1;line-height:1.1}
.top .back{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--fg2)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:500}
.muted{color:var(--fg2)}.small{font-size:12.5px}.tiny{font-size:11.5px;color:var(--fg3)}
.gold{color:var(--gold2)}
/* nav */
.nav{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(10,10,11,.85) 30%,var(--bg) 60%);padding:16px 10px calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;z-index:6}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);width:64px}
.nav button.on{color:var(--gold2)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card.tap{cursor:pointer;transition:border-color .15s}.card.tap:hover{border-color:var(--gold3)}
.row{display:flex;align-items:center;gap:12px}.row.between{justify-content:space-between}.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h2{font-size:22px}.sec>.row>h2{font-size:22px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11.5px;letter-spacing:.03em;border:1px solid var(--line);color:var(--fg2);white-space:nowrap}
.chip.gold{border-color:var(--gold3);color:var(--gold2);background:rgba(201,162,74,.08)}
.chip.ok{border-color:#3b5a40;color:var(--ok)}.chip.warn{border-color:#5a4a26;color:var(--warn)}.chip.bad{border-color:#5a3434;color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:500;font-size:14px;letter-spacing:.02em;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#161206}
.btn.ghost{border:1px solid var(--line);color:var(--fg)}
.btn.block{width:100%}.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:17px;color:var(--gold2);flex:none}
.avatar.lg{width:72px;height:72px;font-size:30px}
.hero{position:relative;border-radius:18px;overflow:hidden;min-height:150px;display:flex;align-items:flex-end;padding:16px;border:1px solid var(--line)}
.hero canvas,.art canvas,.hero .pic,.art .pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .pic::after{content:""}
.hero{isolation:isolate}.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,11,.05),rgba(10,10,11,.85));z-index:1}.hero>*{z-index:2}
.login .bgc{object-fit:cover;opacity:.55;mask-image:linear-gradient(180deg,#000 40%,transparent 95%);-webkit-mask-image:linear-gradient(180deg,#000 40%,transparent 95%)}
.hero>*{position:relative}
.hero h2{font-size:30px;line-height:1}
.art{position:relative;border-radius:12px;overflow:hidden;background:var(--card2);aspect-ratio:1;max-width:100%}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv .card{gap:2px}.kv .n{font-family:var(--display);font-size:30px;line-height:1;color:var(--gold2)}
.list{display:flex;flex-direction:column}
.list>.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.list>.item:last-child{border-bottom:0}
.time{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--fg2);width:78px;flex:none}
.hr{height:1px;background:var(--line)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px;border-radius:9px;font-size:13px;color:var(--fg2)}
.seg button.on{background:var(--card2);color:var(--gold2)}
/* calendar */
.days{display:flex;gap:6px}
.days button{flex:1;padding:8px 0;border-radius:10px;border:1px solid var(--line);font-size:12px;color:var(--fg2);display:flex;flex-direction:column;gap:2px;align-items:center}
.days button b{font-weight:500;color:var(--fg);font-size:15px}
.days button.on{border-color:var(--gold3);background:rgba(201,162,74,.08);color:var(--gold2)}
.cal{display:grid;grid-template-columns:44px 1fr 1fr;gap:4px;font-size:11.5px}
.cal .h{text-align:center;padding:6px 0;color:var(--fg2);letter-spacing:.08em;text-transform:uppercase;font-size:10.5px}
.cal .t{color:var(--fg3);font-variant-numeric:tabular-nums;padding-top:2px;text-align:right;padding-right:6px}
.cal .slot{min-height:30px;border-radius:7px;border:1px dashed var(--line);display:flex;align-items:center;padding:4px 7px;overflow:hidden}
.cal .slot.free{cursor:pointer;color:var(--fg3)}.cal .slot.free:hover{border-color:var(--gold3);color:var(--gold2)}
.cal .slot.busy{background:var(--card2);border:1px solid var(--line);color:var(--fg);cursor:pointer}
.cal .slot.busy.mine{border-color:var(--gold3);background:rgba(201,162,74,.12)}
.cal .slot.booking{background:rgba(127,182,134,.12);border:1px solid #3b5a40}
.cal .slot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* feed */
.post{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.post .meta{display:flex;align-items:center;gap:10px}
.post .acts{display:flex;gap:16px;font-size:12.5px;color:var(--fg2)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* video */
.video{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/9;background:#000;border:1px solid var(--line);max-width:100%}
.video .play{position:absolute;inset:0;display:grid;place-items:center}
.video .play button{width:58px;height:58px;border-radius:50%;background:rgba(201,162,74,.9);color:#161206;display:grid;place-items:center}
.video .bar{position:absolute;left:12px;right:12px;bottom:10px;height:3px;background:rgba(255,255,255,.2);border-radius:2px}
.video .bar i{display:block;width:38%;height:100%;background:var(--gold2);border-radius:2px}
.counts{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.counts button{padding:8px 0;border-radius:8px;border:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:13px;color:var(--fg2)}
.counts button.on{border-color:var(--gold3);background:rgba(201,162,74,.12);color:var(--gold2)}
/* formation */
.floor{position:relative;aspect-ratio:4/3;border:1px solid var(--line);border-radius:12px;background:repeating-linear-gradient(90deg,transparent 0 24.5%,var(--line) 24.5% 25%),repeating-linear-gradient(0deg,transparent 0 33%,var(--line) 33% 33.4%);max-width:100%}
.floor .d{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--card2);border:1px solid var(--gold3);display:grid;place-items:center;font-size:10px;color:var(--gold2);transform:translate(-50%,-50%);transition:left .4s,top .4s}
.floor .d.me{background:var(--gold);color:#161206;font-weight:600}
/* toast / sheet */
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--card2);border:1px solid var(--gold3);border-radius:12px;padding:12px 14px;font-size:13.5px;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:8;display:flex;align-items:flex-end}
.sheet{background:var(--bg2);border-radius:22px 22px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));width:100%;max-height:85%;overflow:auto;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line)}
.sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet h2{font-size:24px}
.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--fg2);letter-spacing:.04em}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.sw{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--fg2);transition:left .15s}
.sw.on{background:var(--gold3)}.sw.on i{left:21px;background:var(--gold2)}
.check{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;flex:none;color:#161206}
.check.on{background:var(--gold);border-color:var(--gold)}
/* login */
.login{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 24px 40px;position:relative;gap:18px}
.brand{display:block;margin:0 auto 4px;max-width:100%;filter:drop-shadow(0 8px 24px rgba(201,162,74,.25))}
.login .bgc{position:absolute;inset:0;width:100%;height:100%}
.login>*{position:relative}
.logo{display:flex;align-items:baseline;gap:4px;font-family:var(--display)}
.logo b{font-size:64px;font-weight:500;line-height:.9;letter-spacing:-.02em;background:linear-gradient(180deg,var(--gold2),var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo span{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--fg2);font-family:var(--body)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.roles button{padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(24,24,27,.7);text-align:left;display:flex;flex-direction:column;gap:3px;backdrop-filter:blur(6px)}
.roles button:hover{border-color:var(--gold3)}
.roles b{font-weight:500;font-size:15px}
.roles small{color:var(--fg2);font-size:12px}
.tabs{display:flex;gap:16px;border-bottom:1px solid var(--line)}
.tabs button{padding:8px 2px;font-size:13.5px;color:var(--fg2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--gold2);border-color:var(--gold)}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden}.prog i{display:block;height:100%;background:var(--gold)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none}
.note{border-left:2px solid var(--gold3);padding-left:12px}
.week{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.week .col{display:flex;flex-direction:column;gap:4px}
.week .col h4{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);font-weight:500;text-align:center}
.week .blk{border-radius:6px;padding:4px 5px;font-size:10px;line-height:1.2;border:1px solid var(--line);background:var(--card);overflow:hidden;cursor:grab}
.week .blk.s{border-left:2px solid var(--gold)}.week .blk.l{border-left:2px solid #6f8fa7}
.week .blk b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo-badge{position:absolute;bottom:94px;right:14px;z-index:7;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);border:1px solid var(--line);padding:3px 8px;border-radius:999px;background:rgba(10,10,11,.7)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

/* ---------- artwork: generative "stage light" canvases (stand-ins for the studio's photos) ---------- */
function art(c,seed,opts={}){const ctx=c.getContext("2d");const W=c.width=(c.clientWidth||300)*2,H=c.height=(c.clientHeight||200)*2;let r=seed*9301+49297;const rnd=()=>{r=(r*9301+49297)%233280;return r/233280};
 // stage floor + back wall
 const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#070707");bg.addColorStop(.62,"#15120d");bg.addColorStop(1,"#0b0a09");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 // haze / spotlights from above
 const n=2+Math.floor(rnd()*2);for(let i=0;i<n;i++){const x=W*(.15+rnd()*.7),gold=rnd()>.35;ctx.save();ctx.globalCompositeOperation="lighter";const g=ctx.createLinearGradient(x,0,x,H);g.addColorStop(0,gold?"rgba(230,200,122,.55)":"rgba(200,195,185,.4)");g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-W*.04,-10);ctx.lineTo(x+W*.04,-10);ctx.lineTo(x+W*(.25+rnd()*.2),H);ctx.lineTo(x-W*(.25+rnd()*.2),H);ctx.closePath();ctx.filter="blur(18px)";ctx.fill();ctx.restore()}
 // bokeh
 ctx.save();ctx.globalCompositeOperation="lighter";const nb=Math.round(W*H/26000);for(let i=0;i<nb;i++){const x=rnd()*W,y=rnd()*H*.75,rad=Math.max(2,H*.012+rnd()*H*.03);const g=ctx.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,`rgba(243,220,154,${.25+rnd()*.35})`);g.addColorStop(1,"rgba(243,220,154,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rad,0,7);ctx.fill()}ctx.restore();
 // floor reflection band
 const fl=ctx.createLinearGradient(0,H*.72,0,H);fl.addColorStop(0,"rgba(201,162,74,.18)");fl.addColorStop(1,"rgba(201,162,74,0)");ctx.fillStyle=fl;ctx.fillRect(0,H*.72,W,H*.28);
 if(opts.figure!==false){ // dancer silhouette, varying pose
  const pose=Math.floor(rnd()*4),cx=W*(.45+rnd()*.25),s=Math.min(H*.3,W*.16),fy=H*.88;ctx.fillStyle="#050505";ctx.strokeStyle="#050505";ctx.lineCap="round";ctx.lineJoin="round";
  const L=(x1,y1,x2,y2,w)=>{ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()};
  const C=(x1,y1,cx1,cy1,x2,y2,w)=>{ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(cx1,cy1,x2,y2);ctx.stroke()};
  const hip=[cx,fy-s*1.05],sh=[cx+(pose===2?s*.15:0),fy-s*1.9];
  // torso
  C(hip[0],hip[1],hip[0]+s*.1,fy-s*1.5,sh[0],sh[1],s*.34);
  // head
  ctx.beginPath();ctx.arc(sh[0]+(pose===2?s*.12:s*.02),sh[1]-s*.32,s*.17,0,7);ctx.fill();
  if(pose===0){ // arabesque
   L(hip[0],hip[1],cx-s*.12,fy,s*.17);L(hip[0],hip[1],cx+s*.9,fy-s*1.25,s*.16);C(sh[0],sh[1],sh[0]-s*.5,sh[1]-s*.45,sh[0]-s*.95,sh[1]-s*.65,s*.12);C(sh[0],sh[1],sh[0]+s*.4,sh[1]-.1*s,sh[0]+s*.75,sh[1]+s*.1,s*.12)}
  else if(pose===1){ // jump, arms up
   L(hip[0],hip[1],cx-s*.55,fy-s*.55,s*.17);L(cx-s*.55,fy-s*.55,cx-s*.35,fy-s*.1,s*.15);L(hip[0],hip[1],cx+s*.6,fy-s*.6,s*.17);L(cx+s*.6,fy-s*.6,cx+s*.95,fy-s*.95,s*.15);L(sh[0],sh[1],sh[0]-s*.55,sh[1]-s*.85,s*.12);L(sh[0],sh[1],sh[0]+s*.55,sh[1]-s*.85,s*.12)}
  else if(pose===2){ // lean / contemporary reach
   L(hip[0],hip[1],cx-s*.15,fy,s*.17);L(hip[0],hip[1],cx+s*.35,fy,s*.17);C(sh[0],sh[1],sh[0]+s*.5,sh[1]-s*.6,sh[0]+s*.9,sh[1]-s*.95,s*.12);C(sh[0],sh[1],sh[0]-s*.4,sh[1]+s*.2,sh[0]-s*.7,sh[1]+s*.5,s*.12)}
  else{ // pose on relevé, arms in V
   L(hip[0],hip[1],cx-s*.1,fy,s*.17);L(hip[0],hip[1],cx+s*.15,fy,s*.17);L(sh[0],sh[1],sh[0]-s*.7,sh[1]-s*.5,s*.12);L(sh[0],sh[1],sh[0]+s*.7,sh[1]-s*.5,s*.12)}
  // rim light
  ctx.save();ctx.globalCompositeOperation="lighter";const rl=ctx.createRadialGradient(cx,fy-s*1.3,s*.2,cx,fy-s*1.3,s*1.6);rl.addColorStop(0,"rgba(230,200,122,.22)");rl.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=rl;ctx.fillRect(0,0,W,H);ctx.restore();
  // floor shadow/reflection
  const sg=ctx.createRadialGradient(cx,fy+4,0,cx,fy+4,s*.6);sg.addColorStop(0,"rgba(0,0,0,.6)");sg.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=sg;ctx.fillRect(0,fy-20,W,80);
 }
 // film grain
 ctx.save();ctx.globalAlpha=.06;for(let i=0;i<W*H/900;i++){ctx.fillStyle=rnd()>.5?"#fff":"#000";ctx.fillRect(rnd()*W,rnd()*H,2,2)}ctx.restore();
 const v=ctx.createLinearGradient(0,0,0,H);v.addColorStop(0,"rgba(10,10,11,0)");v.addColorStop(.55,"rgba(10,10,11,.1)");v.addColorStop(1,"rgba(10,10,11,.8)");ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}

function calScreen(){const d=S.cal.day;const rooms=S.cal.room==="both"?["S","L"]:[S.cal.room];const all=[...SCHEDULE,...BOOKINGS].filter(e=>e.day===d);const hours=[];for(let h=15;h<=21;h++)hours.push(h);if(d>=4){hours.length=0;for(let h=9;h<=20;h++)hours.push(h)}
 const cell=(room,h)=>{const ev=all.find(e=>e.room===room&&parseInt(e.start)===h);if(ev){const mine=ev.kind==="booking"&&(ev.by===me().name.split(" ")[0]);return `<div class="slot ${ev.kind==="booking"?"booking":"busy"} ${mine?"mine":""}" onclick="eventSheet('${ev.id}')"><span>${esc(ev.name)}<br><small class="tiny">${ev.start}–${ev.end}</small></span></div>`}

 <div class="days">${DAYS.map((n,i)=>`<button class="${i===d?"on":""}" onclick="S.cal.day=${i};render()"><span>${n}</span><b>${19+i}</b></button>`).join("")}</div>

 <div class="week">${cols.map(d=>`<div class="col"><h4>${DAYS[d]}</h4>${SCHEDULE.filter(t=>t.day===d&&t.room==="S").map(t=>`<div class="blk s" onclick="go('editTraining',{id:${t.id}})"><b>${esc(t.name)}</b>${t.start}–${t.end}</div>`).join("")}</div>`).join("")}</div>

 <div class="sec"><div class="eyebrow">The AXIS – adgang</div><div class="card list">${["Freja T. + Steffen (forælder)","Alma N. + Karin","Ida S. + Peter","Mille K. (fra Apexion – teknik)"].map(n=>`<div class="item"><div class="grow small">${n}</div><div class="sw on" onclick="this.classList.toggle('on')"><i></i></div></div>`).join("")}</div></div></div>`}

function bookingRequestsScreen(){return `${topbar("Bookinger")}<div class="content fade"><div class="stack">${BOOKINGS.filter(b=>b.by!=="Line").map(b=>`<div class="card"><div class="row between"><div><div>${esc(b.name)}</div><div class="tiny">${DAYS[b.day]} ${b.start}–${b.end} · ${ROOMS[b.room]} · ${b.by}</div></div></div><div class="row"><button class="btn primary sm grow" onclick="this.closest('.card').innerHTML='<span class=\\'chip ok\\'>Godkendt</span>'">Godkend</button><button class="btn ghost sm" onclick="BOOKINGS=BOOKINGS.filter(x=>x.id!=='${b.id}');render();toast('Afvist – danseren har fået besked')">Afvis</button></div></div>`).join("")||`<div class="card tiny">Ingen bookinger afventer</div>`}</div></div>`}

 return `${topbar("Afbud i dag")}<div class="content fade"><div class="card list">${[...extra,...base].map(a=>`<div class="item"><div class="avatar">${a[0][0]}</div><div class="grow"><div>${a[0]}</div><div class="tiny">${a[1]}</div></div>${a[2]?`<span class="chip">${a[2]}</span>`:""}</div>`).join("")}</div></div>`}

 if(!S.role||S.screen==="login"){html=`<div class="screen">${loginScreen()}</div>`}
 else{const name=S.screen==="tab"?S.tab:S.screen;const f=SCREENS[name]||homeScreen;html=`<div class="screen">${f()}</div>${nav()}<div class="demo-badge">Demo · ${me().role}</div>`}
 phone.innerHTML=html;paint();const sc=phone.querySelector(".screen");if(sc)sc.scrollTop=0}
